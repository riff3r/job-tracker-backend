services:
  postgres:
    image: postgres:16-alpine
    container_name: job_tracker_postgres
    environment:
      POSTGRES_USER: ruhul
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: job_tracker_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
